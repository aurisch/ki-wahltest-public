name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Primary data integrity audit
        run: npm run audit:data
      - name: Type checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Static build
        run: npm run build
      - name: Generated site audit
        run: npm run audit:site
      - name: Launch gate
        run: node scripts/check-launch.mjs
